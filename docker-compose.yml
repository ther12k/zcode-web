services:
  zcode-web:
    build: .
    container_name: zcode-web
    ports:
      - "127.0.0.1:${ZCODE_WEB_PORT:-3000}:3000"
    environment:
      # REQUIRED: protects an agent that can run commands inside this container
      ZCODE_WEB_TOKEN: ${ZCODE_WEB_TOKEN:?Set a strong ZCODE_WEB_TOKEN (required — no insecure default)}
      # Permission modes exposed in the UI (plan is safest default)
      ZCODE_ALLOWED_MODES: ${ZCODE_ALLOWED_MODES:-plan,build,edit,yolo}
      # Execution engine: agent = long-lived agent-server per workspace with
      # native session/stop cancellation (set to `prompt` for instant
      # rollback to the one-shot-CLI-per-message engine)
      ZCODE_BRIDGE_ENGINE: ${ZCODE_BRIDGE_ENGINE:-agent}
      ZCODE_MAX_JOBS: ${ZCODE_MAX_JOBS:-3}
      ZCODE_JOB_TIMEOUT_MS: ${ZCODE_JOB_TIMEOUT_MS:-900000}
    volumes:
      # bring-your-own CLI bundle (also baked in at build time if present in ./cli)
      - ./cli/zcode.cjs:/opt/zcode/zcode.cjs:ro
      # REQUIRED by CLI >= 0.16.9: builtin provider config, staged next to the
      # bundle (see cli/README.md)
      - ./cli/provider/zcode-builtin.json:/opt/zcode/provider/zcode-builtin.json:ro
      # dynamic-workflows skill (Apache-2.0, committed): CreateWorkflow refuses
      # to run until the skill is loadable from the user scope — which is
      # /data/zcode/skills through the image's /root/.zcode symlink
      - ./cli/skills/dynamic-workflows:/data/zcode/skills/dynamic-workflows:ro
      # CLI state: config.json, sessions db, credentials — set up once (see README)
      - ./data/zcode:/data/zcode
      # your projects live here
      - ./data/workspace:/data/workspace
    restart: unless-stopped
